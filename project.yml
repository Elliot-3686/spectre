name: Spectre
options:
  bundleIdPrefix: com.elliot
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  SpectreCore:
    path: Packages/SpectreCore
targets:
  Spectre:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SpectreCore
        product: SpectreCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Spectre
        CFBundleDisplayName: Spectre
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Spectre"
        NSAudioCaptureUsageDescription: "Spectre analyse uniquement le son de Spotify pour afficher son spectre en temps réel. Le son que vous entendez n'est ni modifié ni retardé, et rien n'est enregistré."
        NSAppleEventsUsageDescription: "Spectre peut lire le titre du morceau en cours dans Spotify."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/Spectre.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliot.spectre
        PRODUCT_NAME: Spectre
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        MTL_FAST_MATH: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
